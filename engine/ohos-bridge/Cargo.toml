[package]
name = "dashbeam-ohos-bridge"
version = "0.1.0"
edition = "2021"
authors = ["Tony Antony <tonyantony300@gmail.com>"]
license = "AGPL-3.0-only"
repository = "https://github.com/tonyantony300/dashbeam"
description = "HarmonyOS C ABI bridge for the DashBeam engine"
rust-version = "1.91"

[lib]
name = "dashbeam_ohos_bridge"
crate-type = ["staticlib"]

[dependencies]
native = { path = "../native", package = "sendme-native" }
protocol = { path = "../protocol", package = "sendme-protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1.0.108"
tokio = { version = "1.34.0", features = ["rt-multi-thread", "sync"] }
tracing = "0.1.40"